<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Like Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>
<button id="likeBtn">👍 Like</button>
<div>Likes: <span id="likeCount">0</span></div>

<script>
const supabaseUrl = 'https://zungpwkzouoyzplnrrxv.supabase.co';
const supabaseKey = 'sb_publishable_BWbybVJDJoW3bEUqQfp2Kg_WFUoBQQh';
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

const likeBtn = document.getElementById('likeBtn');
const likeCount = document.getElementById('likeCount');

async function initLike() {
  const { data } = await supabase
    .from('likes')
    .select('count')
    .eq('id', 1)
    .maybeSingle();

  if (!data) {
    const { data: inserted } = await supabase
      .from('likes')
      .insert({ id: 1, count: 2 })
      .select()
      .single();
    likeCount.textContent = inserted.count;
  } else {
    likeCount.textContent = data.count;
  }
}

async function addLike() {
  const { data } = await supabase
    .from('likes')
    .select('count')
    .eq('id', 1)
    .single();
  if (!data) return;
  const newCount = data.count + 1;
  await supabase
    .from('likes')
    .update({ count: newCount })
    .eq('id', 1);
  likeCount.textContent = newCount;
}

likeBtn.addEventListener('click', addLike);
initLike();
</script>
</body>
</html>
